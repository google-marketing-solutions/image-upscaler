# ============================================================================
# Remote Terraform Execution via Cloud Build (`cloudbuild-terraform.yaml`)
# ============================================================================
# Runs `terraform init` and `terraform apply` inside Google Cloud Build so
# no local `terraform` binary installation is required on the operator machine.
# ============================================================================

substitutions:
  _REGION: "asia-northeast1"
  _ACCESS_CODE: "change-me"
  _FIRESTORE_DB: "gmc-upscaler-db"
  _TF_STATE_BUCKET: "${PROJECT_ID}-upscaler-tfstate"

steps:
  # Step 1: Build and push the application container image first
  - name: "gcr.io/cloud-builders/docker"
    id: "build-and-push-app-image"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        REPO="${_REGION}-docker.pkg.dev/${PROJECT_ID}/image-upscaler-repo"
        IMG="${REPO}/gmc-image-upscaler:latest"
        docker build -t "${IMG}" .
        docker push "${IMG}"

  # Step 2: Run Terraform inside official hashicorp/terraform container on GCP
  - name: "hashicorp/terraform:1.8"
    id: "terraform-apply"
    dir: "terraform"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        cat > backend_override.tf <<EOF
        terraform {
          backend "gcs" {
            bucket = "${_TF_STATE_BUCKET}"
            prefix = "image-upscaler/state"
          }
        }
        EOF
        REPO="${_REGION}-docker.pkg.dev/${PROJECT_ID}/image-upscaler-repo"
        IMG="${REPO}/gmc-image-upscaler:latest"
        terraform init -input=false
        terraform apply -auto-approve -input=false \
          -var="project_id=${PROJECT_ID}" \
          -var="region=${_REGION}" \
          -var="access_code=${_ACCESS_CODE}" \
          -var="firestore_database_id=${_FIRESTORE_DB}" \
          -var="auto_build_container=false" \
          -var="container_image=${IMG}"

options:
  logging: CLOUD_LOGGING_ONLY
